<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualiUBS</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

<div class="p-6">

<h1 class="text-3xl font-bold mb-5">
QualiUBS
</h1>

<div id="abas"
class="flex overflow-x-auto gap-2 mb-6">
</div>

<div class="mb-4">
Score Geral:
<span id="score">0%</span>
</div>

<div id="conteudo"></div>

</div>

<script>

const eixos=[
"CCIB",
"NSP",
"Gestão do Cuidado",
"Acolhimento",
"Jornada do Paciente",
"Vacina",
"Curativo",
"Medicação",
"Emergência",
"Expurgo",
"Esterilização",
"Laboratório",
"Odontologia",
"Farmácia",
"DML",
"Políticas",
"Colaboradores"
]

let abaAtiva="CCIB"

let checklist=JSON.parse(
localStorage.getItem("qualiubs")
)||[
{
id:1,
eixo:"CCIB",
requisito:"Possui POP atualizado?",
classificacao:null,
observacao:"",
pontuacao:0
}
]

function calcular(status){

if(status==="C") return 1

if(status==="PC") return .5

return 0

}

function selecionar(id,status){

checklist=checklist.map(item=>{

if(item.id!==id) return item

let observacao=item.observacao

if(
status==="PC" ||
status==="NC"
){

observacao=prompt(
"Observação obrigatória:"
)

if(!observacao){

alert(
"Observação obrigatória"
)

return item

}

}

return{
...item,
classificacao:status,
observacao,
pontuacao:calcular(status)
}

})

salvar()

render()

}

function salvar(){

localStorage.setItem(
"qualiubs",
JSON.stringify(checklist)
)

}

function renderAbas(){

const div=
document.getElementById(
"abas"
)

div.innerHTML=""

eixos.forEach(e=>{

div.innerHTML+=`

<button
onclick="trocarAba('${e}')"
class="px-4 py-2 rounded-xl border
${abaAtiva===e?
'bg-black text-white':''}
">

${e}

</button>

`

})

}

function trocarAba(e){

abaAtiva=e

render()

}

function render(){

renderAbas()

const conteudo=
document.getElementById(
"conteudo"
)

const score=
(
checklist.reduce(
(a,b)=>a+b.pontuacao,
0
)
/
checklist.length
)*100

document.getElementById(
"score"
).innerText=
score.toFixed(0)+"%"

conteudo.innerHTML=""

checklist
.filter(
x=>x.eixo===abaAtiva
)
.forEach(item=>{

conteudo.innerHTML+=`

<div class="
bg-white
p-4
rounded-xl
shadow
mb-4">

<h3 class="font-bold">
${item.requisito}
</h3>

<div class="
flex gap-2 mt-3">

<button
onclick="selecionar(${item.id},'C')"
class="
bg-green-500
text-white
px-3
py-2
rounded">

✔ Conforme

</button>

<button
onclick="selecionar(${item.id},'PC')"
class="
bg-yellow-400
px-3
py-2
rounded">

⚠ Parcial

</button>

<button
onclick="selecionar(${item.id},'NC')"
class="
bg-red-500
text-white
px-3
py-2
rounded">

✖ Não Conforme

</button>

</div>

${
item.observacao?

`<p class='mt-3'>
<b>Observação:</b>
${item.observacao}
</p>`

:''

}

</div>

`

})

}

render()

</script>

</body>
</html>
