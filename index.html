<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualiUBS</title>

<style>
body{
font-family:Arial;
padding:20px;
background:#f2f2f2;
}
.botao{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin:4px;
}
.verde{background:green;color:white}
.amarelo{background:gold}
.vermelho{background:red;color:white}
.aba{
padding:8px;
margin:4px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>QualiUBS</h1>

<div id="abas"></div>

<p>
Score:
<span id="score">0%</span>
</p>

<div id="conteudo"></div>

<script>

const eixos=["CCIB","NSP","Farmácia"]

let aba="CCIB"

let checklist=[
{
id:1,
eixo:"CCIB",
requisito:"Possui POP atualizado?",
observacao:"",
pontuacao:0
}
]

function desenharAbas(){

let html=""

eixos.forEach(e=>{

html+=`
<button
class="aba"
onclick="trocar('${e}')"
>
${e}
</button>
`

})

document
.getElementById("abas")
.innerHTML=html

}

function trocar(nome){

aba=nome

render()

}

function selecionar(id,tipo){

let item=
checklist.find(
x=>x.id===id
)

if(
tipo==="PC" ||
tipo==="NC"
){

let obs=
prompt(
"Digite observação"
)

if(!obs){

alert(
"Obrigatório"
)

return

}

item.observacao=obs

}

if(tipo==="C")
item.pontuacao=1

if(tipo==="PC")
item.pontuacao=.5

if(tipo==="NC")
item.pontuacao=0

render()

}

function render(){

desenharAbas()

let html=""

checklist
.filter(
x=>x.eixo===aba
)
.forEach(item=>{

html+=`

<div style="
background:white;
padding:15px;
margin-top:10px;
border-radius:10px">

<h3>
${item.requisito}
</h3>

<button
class="
botao verde"
onclick="
selecionar(${item.id},'C')
">
✔ Conforme
</button>

<button
class="
botao amarelo"
onclick="
selecionar(${item.id},'PC')
">
⚠ Parcial
</button>

<button
class="
botao vermelho"
onclick="
selecionar(${item.id},'NC')
">
✖ Não Conforme
</button>

<p>
${item.observacao}
</p>

</div>
`
})

document
.getElementById(
"conteudo"
)
.innerHTML=html

let score=
(checklist.reduce(
(a,b)=>a+b.pontuacao,
0
)/checklist.length)*100

document
.getElementById(
"score"
)
.innerText=
score.toFixed(0)+"%"

}

render()

</script>

</body>
</html>
